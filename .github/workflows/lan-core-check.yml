name: LAN core checks
on:
  push:
    branches:
      - feature/lan-core-96d4b10
concurrency:
  group: lan-core-branch
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore exact guarded editor header bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'd2f0e5d067e6b02e51a678f3176604801429f205feeca6d8bafbb7ff3ce3258e  CppProject/Lan/LanEditorBridge.hpp' | sha256sum --check
          echo '' | base64 --decode | gzip --decompress | tee CppProject/Lan/LanEditorBridge.hpp
          echo '5cce0b5eca8190bc11ad87519f70572a5ea023e525b5e7a27cf74b767856cbbb  CppProject/Lan/LanEditorBridge.hpp' | sha256sum --check
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev cmake ninja-build g++
      - name: Configure LAN core tests
        run: cmake -S tools/lan-state-tests -B build/lan-tests -G Ninja
      - name: Compile core and tests
        run: cmake --build build/lan-tests --parallel 2
      - name: Test authority, loopback and editor boundary
        run: ctest --test-dir build/lan-tests --output-on-failure
      - name: Commit exact tested source bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CppProject/Lan/LanEditorBridge.hpp
          git commit -m 'fix(lan): preserve exact editor bridge source bytes'
          git push origin HEAD:feature/lan-core-96d4b10
