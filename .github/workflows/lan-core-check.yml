name: LAN core checks
on:
  push:
    branches:
      - feature/lan-core-96d4b10
concurrency:
  group: lan-core-branch
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Qt build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qtbase5-dev cmake ninja-build g++
      - name: Configure LAN core tests
        run: cmake -S tools/lan-state-tests -B build/lan-tests -G Ninja
      - name: Compile core and tests
        run: cmake --build build/lan-tests --parallel 2
      - name: Test authority, loopback and editor boundary
        run: ctest --test-dir build/lan-tests --output-on-failure